[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Function calling tool using constrained decoding with a small LLM"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "lanasain", email = "lanasain@student.42antananarivo.mg" },
]
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "huggingface-hub>=0.20.0",
    "numpy>=1.26.0",
    "pydantic>=2.0.0",
]

[dependency-groups]
dev = [
    "mypy>=1.10.0",
    "flake8>=7.0.0",
]